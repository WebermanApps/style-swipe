<style>
:root{color-scheme:light;--bg:#FAF3EB;--panel:#FFFDF7;--line:#E4D6C4;--text:#1F1F1F;--muted:#6B5E50;--a:#05668D;--b:#C1502E;--ok:#0B6E4F;
 --no:#A4161A;--maybe:#D4A017;--maybe-dk:#9A6F00;--love:#E0245E;--yes:#0B6E4F;--terracotta:#C1502E;--lagoon:#05668D}
/* Max Weberman brand hover motion (brand-tokens.css .mw-hover) */
:root{--mw-ease:cubic-bezier(.2,.8,.2,1);--mw-dur:180ms}
.mw-hover{transition:transform var(--mw-dur) var(--mw-ease),box-shadow var(--mw-dur) var(--mw-ease),background-color var(--mw-dur) var(--mw-ease)}
@media (hover:hover){.mw-hover:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 6px 18px rgba(10,10,10,.12)}}
.mw-hover:focus-visible{transform:translateY(-1px) scale(1.03);box-shadow:0 6px 18px rgba(10,10,10,.12)}
.mw-hover:active{transform:scale(.98)}
.card.mw-card{transition:transform .25s ease,opacity .25s,box-shadow var(--mw-dur) var(--mw-ease)}
@media (hover:hover){.card.mw-card:not(.dragging):hover{box-shadow:0 10px 26px rgba(80,50,20,.14)}}
@media (prefers-reduced-motion:reduce){.mw-hover,.mw-hover:hover,.mw-hover:focus-visible{transition:none;transform:none}}
h1,h2,.card h2{font-family:Khand,Inter,sans-serif;letter-spacing:.01em}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Hind,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;min-height:100dvh}
header{padding:12px 16px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;letter-spacing:.01em}
header .sub{color:var(--muted);font-size:12px}
.progress{flex:1 1 100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--terracotta),var(--lagoon));transition:width .3s}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 10px 10px;overflow:hidden}
.stage{position:relative;width:100%;max-width:760px;flex:1;display:flex;min-height:0}
.card{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;user-select:none;transition:transform .25s ease, opacity .25s;will-change:transform;overflow:hidden}
.card.dragging{transition:none}
.card .cat{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.card h2{margin:0;font-size:16px;font-weight:700}
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.opt{position:relative;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;cursor:pointer;transition:border-color .15s, box-shadow .15s, transform .15s;background:#FFFFFF}
.opt:hover{border-color:#cdb9a0}
.opt.hot-a{border-color:var(--a);box-shadow:0 0 0 3px rgba(76,201,240,.25)}
.opt.hot-b{border-color:var(--b);box-shadow:0 0 0 3px rgba(247,37,133,.25)}
.opt .side{font-size:10px;font-weight:800;letter-spacing:.1em}
.opt.A .side{color:var(--a)}.opt.B .side{color:var(--b)}
.opt h3{margin:2px 0 0;font-size:14px;line-height:1.2}
.opt p{margin:0;color:var(--muted);font-size:12px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;padding:2px 6px;border-radius:999px;background:#F1E6D6;color:#4A3F35}
.vis{border-radius:10px;overflow:hidden;flex:0 0 auto;min-height:120px;position:relative;background:#EFE6D8}
.stamp{position:absolute;top:40%;font-size:28px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:10px;opacity:0;transform:rotate(-12deg);pointer-events:none;z-index:5;background:rgba(0,0,0,.35)}
.stamp.l{left:16px;color:var(--a)}.stamp.r{right:16px;color:var(--b);transform:rotate(12deg)}
.controls{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;max-width:760px;width:100%;margin:0 auto;padding:10px 10px calc(12px + env(safe-area-inset-bottom))}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer;min-width:64px}
button:active{transform:scale(.97)}
button.a{border-color:var(--a);color:var(--a)}button.b{border-color:var(--b);color:var(--b)}
button.primary{background:linear-gradient(90deg,var(--terracotta),var(--lagoon));border:0;color:#fff}
button.small{padding:8px 10px;font-size:13px;min-width:0}
.hint{color:var(--muted);font-size:11px;text-align:center;padding:0 10px}
/* visual renderers */
.v-ui{padding:10px;height:100%;min-height:150px;display:flex;flex-direction:column;gap:8px}
.v-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.v-ui .dot{width:18px;height:18px;border-radius:50%}
.v-ui .cardm{padding:10px;display:flex;flex-direction:column;gap:6px}
.v-ui .btn{align-self:flex-start;padding:6px 12px;font-size:11px;font-weight:700}
.v-ui .row{display:flex;gap:6px}.v-ui .chip{font-size:10px;padding:3px 7px;opacity:.85}
.v-pal{display:flex;height:150px}
.v-pal div{flex:1;display:flex;align-items:flex-end;justify-content:center;font:600 9px/1 'IBM Plex Mono',monospace;padding-bottom:6px;writing-mode:vertical-rl;transform:rotate(180deg)}
.v-type{background:#faf8f3;color:#141414;padding:12px;min-height:150px}
.v-type .h{font-size:24px;line-height:1.05;margin-bottom:6px}
.v-type .s{font-size:13px;opacity:.7;margin-bottom:6px}
.v-type .b{font-size:12px;line-height:1.45}
.v-tone{background:#f3f4f6;color:#111;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:150px;font-size:13px;line-height:1.35}
.v-tone .msg{background:#fff;border-radius:12px 12px 12px 3px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.v-tone .from{font-size:10px;color:#6b7280;font-weight:600}
.v-img img{width:100%;height:170px;object-fit:cover;display:block}
.sw{display:flex;gap:4px;padding:6px;background:#EFE6D8}.sw span{flex:1;height:14px;border-radius:4px}
.mats{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px 6px;background:#EFE6D8}
.v-mood{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:52px;gap:3px;padding:3px;background:#EFE6D8}
.v-mood div:first-child{grid-row:span 2}
.v-mood .m{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#111;background:#f2f2f2;border-radius:3px;text-align:center;padding:2px}
.v-logo{height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.v-logo .mk{width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative}
.v-logo .wd{font-size:20px;text-align:center;line-height:1}
.v-thumb{position:relative;aspect-ratio:16/9;overflow:hidden}
.v-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v-thumb .ov{position:absolute;inset:0;display:flex;padding:8px}
/* new renderers */
.v-hero{position:relative;padding:7px;min-height:160px;display:flex;flex-direction:column;overflow:hidden}
.v-post{position:relative;aspect-ratio:1;padding:10px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.v-pace{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:center}
.v-merch{height:160px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#f4f4f4,#cfcfcf)}
/* round-3 formats */
.opt.fmt-bleed .vis{height:250px}
.v-bleed{position:absolute;inset:0}.v-bleed img{width:100%;height:100%;object-fit:cover;display:block}
.v-bleed .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;font-weight:700}

.v-word{height:100%;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.v-mini{height:100%;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
.v-mini .ic{font-size:46px;line-height:1}.v-mini .its{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.v-mini .its span{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.08)}
.v-motion{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
.v-motion .mlab{font:9px 'IBM Plex Mono',monospace;text-align:center;padding:0 4px;word-break:break-all}
@keyframes mo-slide{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@keyframes mo-fade{from{opacity:.1}to{opacity:1}}
@keyframes mo-scale{from{transform:scale(.2)}to{transform:scale(1.1)}}
@keyframes mo-bounce{from{transform:translateY(20px) scale(1.2,.8)}to{transform:translateY(-25px) scale(.9,1.1)}}
@keyframes mo-wiggle{from{transform:rotate(-6deg) translateY(1px)}to{transform:rotate(6deg) translateY(-1px)}}
@keyframes mo-zoom{from{transform:scale(.8);opacity:.5}to{transform:scale(1.4);opacity:1}}
@keyframes mo-glitch{0%{transform:translate(0)}25%{transform:translate(-4px,2px);filter:hue-rotate(90deg)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,0);filter:hue-rotate(-90deg)}100%{transform:translate(0)}}
@keyframes mo-type{from{width:0}to{width:14ch}}
.v-sound{min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px}
.v-sound .eq{animation-play-state:paused}.v-sound:not(.playing) .eq i{animation-play-state:paused}
.play{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;font-size:18px;font-weight:800;border-radius:14px;border:0;background:#05668D;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.4);touch-action:manipulation;cursor:pointer}
.play .pi{font-size:20px}.v-sound.playing .play{background:#0B6E4F;color:#fff}
.silent{color:#6E4F00;font-weight:700}
.v-sound .eq{display:flex;align-items:flex-end;gap:3px;height:60px}.v-sound .eq i{flex:1;border-radius:2px}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}.v-sound .eq i{transform-origin:bottom}
.v-thai{padding:12px;min-height:150px}
.v-texture{height:160px;display:flex;align-items:flex-end;justify-content:flex-end}
.v-texture span,.v-light span{font:600 10px 'IBM Plex Mono',monospace;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;margin:6px;border-radius:4px}
.v-light{height:160px;position:relative;display:flex;align-items:flex-end;justify-content:flex-end}
.v-light .room{position:absolute;left:12%;right:12%;bottom:0;height:28%;background:rgba(0,0,0,.25);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.v-cover-wrap{padding:8px;background:#e9e4d8;display:flex;justify-content:center}
.v-cover{position:relative;width:118px;aspect-ratio:2/3;padding:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:3px 4px 10px rgba(0,0,0,.35)}
.v-sign{height:150px;display:flex;align-items:center;justify-content:center}
/* single-card mode (v3) */
.opts.single{grid-template-columns:1fr;overflow:auto}
.opts.single .opt{cursor:grab;max-width:520px;width:100%;margin:0 auto}
.opts.single .opt .vis{min-height:180px}
.opts.single .opt h3{font-size:18px}.opts.single .opt p{font-size:13px}
.stamp.no{right:16px;color:var(--no);border-color:var(--no);transform:rotate(12deg)}.stamp.yes{left:16px;color:var(--yes);border-color:var(--yes)}
.stamp.maybe{left:50%;top:22%;transform:translateX(-50%) rotate(-4deg);color:#9A6F00;border-color:#9A6F00}
.stamp.love{left:50%;top:22%;transform:translateX(-50%) rotate(4deg);color:var(--love);border-color:var(--love)}
.stamp{background:rgba(255,255,255,.92)!important;transition:opacity .12s}
.controls.v3 button{font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-width:2px}
button.no{background:#FBE8E7;border-color:var(--no);color:#A4161A}
button.maybe{background:#D4A017;border-color:#B88A0E;color:#1F1F1F}
button.love{background:#FDE8EF;border-color:var(--love);color:#9E1240}button.love .h{color:var(--love);font-size:18px}
button.yes{background:var(--yes);border-color:var(--yes);color:#fff}
button.undo{background:#fff;border-color:var(--lagoon);color:#044F6D}
.ans{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;margin-right:3px;color:#fff}
.ans.love{background:var(--love)}.ans.yes{background:var(--yes)}.ans.maybe{background:var(--maybe);color:#111}.ans.no{background:var(--no)}
/* responsive: phone-first, centered card, 44px tap targets */
body.single .stage{max-width:520px;max-height:640px}
body.single .controls{max-width:540px}
.opts.single .opt{min-height:100%}
#btnExportTop{min-height:44px;min-width:64px}
footer label,footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px}
.end .btnrow button{min-height:44px}
/* v4 pair controls */
.controls.v4{flex-direction:column;gap:6px;max-width:560px}
.controls.v4 .row1,.controls.v4 .row2{display:flex;gap:6px;justify-content:center}
.controls.v4 .row1 button{flex:1;min-height:48px;padding:10px 4px;min-width:0;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-width:2px}
.controls.v4 .row2 button{flex:0 1 auto!important;min-width:130px;min-height:44px;padding:8px 18px!important;font-size:13px}
button.this{background:#E2F0F5;border-color:var(--lagoon);color:#044F6D}
button.that{background:#FBEAE3;border-color:var(--terracotta);color:#8E3518}
button.both{background:#E2F2EB;border-color:var(--yes);color:#0B6E4F}
button.neither{background:#FBE8E7;border-color:var(--no);color:#A4161A}
button.love.armed{background:var(--love);color:#fff}button.love.armed .h{color:#fff}
.opt.A .side{color:#044F6D}.opt.B .side{color:#8E3518}
.opt.hot-a{border-color:var(--lagoon);box-shadow:0 0 0 3px rgba(5,102,141,.35)}
.opt.hot-b{border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(193,80,46,.35)}
.card.love-armed .opt{border-color:var(--love);box-shadow:0 0 0 3px rgba(224,36,94,.25)}
.stamp.l{right:16px;color:var(--lagoon);border-color:var(--lagoon);transform:rotate(12deg)}.stamp.r{left:16px;color:var(--terracotta);border-color:var(--terracotta);transform:rotate(-12deg)}
.stamp.both{left:50%;top:22%;transform:translateX(-50%) rotate(-4deg);color:var(--yes);border-color:var(--yes)}
.stamp.neither{left:50%;top:22%;transform:translateX(-50%) rotate(4deg);color:var(--no);border-color:var(--no)}
.stamp.lovea{left:16px;top:22%;color:var(--love);border-color:var(--love)}.stamp.loveb{right:16px;top:22%;color:var(--love);border-color:var(--love);transform:rotate(8deg)}
body.pairs .stage{max-width:760px;max-height:620px}
@media (max-width:420px){.controls.v4 .row1 button{font-size:12px;letter-spacing:.02em}}
/* swipe controls mock (category: Swipe Controls) */
.v-ctl{container-type:inline-size;position:relative;height:190px;padding:8px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.v-ctl .scr{flex:1;border-radius:10px;background:linear-gradient(135deg,rgba(0,0,0,.08),rgba(0,0,0,.18));position:relative;overflow:hidden}
.v-ctl .scr .ph{position:absolute;inset:10px 30% 10px 10px;border-radius:8px;background:rgba(255,255,255,.35);animation:ctlcard 3.2s ease-in-out infinite}
@keyframes ctlcard{0%,20%{transform:none}40%{transform:translateX(30%) rotate(6deg)}60%,100%{transform:none}}
.v-ctl .bar{display:flex;gap:min(5px,1.2cqw);justify-content:center;align-items:flex-end}
.v-ctl .b{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.05;text-align:center;animation:ctlpress 3.2s ease-in-out infinite;white-space:nowrap;flex:0 1 auto;min-width:0}
.v-ctl .b small{font-size:8px;font-weight:600;opacity:.85}
@keyframes ctlpress{0%,8%,100%{transform:none;filter:none}4%{transform:scale(.86);filter:brightness(1.15)}}
.v-ctl.haptic .b{animation-name:ctlsquash}@keyframes ctlsquash{0%,10%,100%{transform:none}3%{transform:scale(1.12,.78)}6%{transform:scale(.94,1.06)}}
.v-ctl.glow .b{animation-name:ctlglow}@keyframes ctlglow{0%,12%,100%{box-shadow:0 0 0 transparent}5%{box-shadow:0 0 14px 4px var(--g)}}
.v-ctl.float .b{position:relative;overflow:visible}.v-ctl.float .b::after{content:attr(data-e);position:absolute;bottom:100%;font-size:16px;opacity:0;animation:ctlfloat 3.2s ease-out infinite;animation-delay:inherit}
@keyframes ctlfloat{0%{opacity:0;transform:none}5%{opacity:1}30%{opacity:0;transform:translateY(-50px)}100%{opacity:0}}
.v-ctl .knob{animation:ctlknob 3.2s ease-in-out infinite alternate}
@keyframes ctlknob{from{left:4%}to{left:84%}}
.v-ctl .needle{transform-origin:50% 100%;animation:ctlneedle 3.2s ease-in-out infinite alternate}
@keyframes ctlneedle{from{transform:rotate(-80deg)}to{transform:rotate(80deg)}}
.v-ctl .hand{animation:ctlhand 2.4s ease-in-out infinite}
@keyframes ctlhand{0%,100%{transform:translateX(-40px)}50%{transform:translateX(40px)}}
.v-ctl .ctl-stamp{animation:ctlstamp 3.2s ease-in-out infinite;opacity:0}@keyframes ctlstamp{0%,22%{opacity:0}32%,48%{opacity:1}60%,100%{opacity:0}}
.v-ctl.fillpress .b{animation-name:ctlfillp}@keyframes ctlfillp{0%,12%,100%{background:transparent;color:var(--g)}4%,9%{background:var(--g);color:#fff;transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){.v-ctl *{animation:none!important}.v-ctl .ctl-stamp{opacity:1}}
button.skip,.controls.v4 .row2 button.skip{background:transparent;border:1px solid transparent;color:#6B5E50;font-weight:600;min-width:72px!important;min-height:44px;padding:8px 12px!important}
button.skip:hover{border-color:var(--line)}
/* polish mocks */
.v-hm{position:relative;height:210px;overflow:hidden;font-family:Hind,system-ui,sans-serif;text-align:left}
.v-hm>div{height:100%}
.v-hm *{min-width:0;overflow-wrap:anywhere}
.v-svg svg{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
/* larger SVG mock screens (scoped to .v-svg so other visual types are unchanged): the screen fills the card width, capped by viewport height */
.v-hm.v-svg{height:auto;min-height:210px}
.v-hm.v-svg>div{padding:2px!important;height:auto!important}
.opt:has(.v-svg){padding:5px}

function shareJson(){const r=buildResults();
 return JSON.stringify({app:'style-swipe',version:r.version,format:r.format,deck:r.deck,answered:r.answered,total:items.length,
  picks:(r.picks||[]).map(p=>single?{card_id:p.card_id,answer:p.answer,note:p.note||undefined}:{pair_id:p.pair_id,choice:p.choice,note:p.note||undefined})})}
const SHARE_MAX=1800;   // longer than this and many share sheets / SMS apps truncate
async function share(){
 const link=appLink(),sum=shareSummary(),has=deck&&picks.length,cj=has?shareJson():'';
 const text=has?`${sum}\n${cj}\n${link}`:`${sum}\n${link}`,long=text.length>SHARE_MAX;
 const shortText=`${sum}\n(Full results JSON copied to clipboard${long?' and attached':''}.)\n${link}`;
 if(long&&has)await copyText(`${sum}\n${cj}`,'Full results copied');
 if(navigator.share){
  try{
   if(long&&has){const file=new File([cj],`style-swipe-results-${deck.date}.json`,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:`Style Swipe ${deck.date}`,text:shortText,files:[file]});return}}
   await navigator.share({title:'Style Swipe',text});return
  }catch(e){if(e&&e.name==='AbortError')return}
 }
 if(isPhone()){openSms(`sms:?&body=${encodeURIComponent(text)}`);return}
 await copyText(text,has?'Copied summary and full results':'Copied link and summary')}
function showEnd(){
 showControls(false);
 const r=buildResults(),max=Math.max(1,...r.top_tags.map(x=>x.score),...r.avoided_tags.map(x=>-x.score));
 const bar=(x,col)=>`<div class="r"><span>${esc(x.tag)}</span><div class="t"><i style="left:0;width:${100*Math.abs(x.score)/max}%;background:${col}"></i></div><span>${x.score>0?'+':''}${x.score}</span></div>`;
 let stats,cats;
 if(single){const t=r.totals;
  stats=`<div class="stat"><b style="color:var(--love)">❤ ${t.love}</b><span>Love</span></div><div class="stat"><b style="color:#0B6E4F">${t.yes}</b><span>Yes</span></div><div class="stat"><b style="color:#9A6F00">${t.maybe}</b><span>Maybe</span></div><div class="stat"><b style="color:#A4161A">${t.no}</b><span>No</span></div>`;
  cats=`<h3>Your Answers By Category</h3><div class="catlist">${Object.entries(r.answers_by_category).map(([c,a])=>`<div><b>${esc(c)}:</b> ${['love','yes','maybe','no'].flatMap(k=>a[k].map(l=>`<span class="ans ${k}">${k==='love'?'❤':k.toUpperCase()}</span>${esc(l)}`)).join(' · ')}</div>`).join('')}</div>`;
 }else{
  const t=r.totals;stats=`<div class="stat"><b>${t.A+t.B}</b><span>This / That</span></div><div class="stat"><b style="color:var(--love)">❤ ${t.loveA+t.loveB}</b><span>Loved</span></div><div class="stat"><b style="color:#0B6E4F">${t.both}</b><span>Both</span></div><div class="stat"><b style="color:#A4161A">${t.neither}</b><span>Neither</span></div>`;
  cats=`<h3>Your Picks By Category</h3><div class="catlist">${Object.entries(r.chosen_by_category).map(([c,l])=>`<div><b>${esc(c)}:</b> ${l.map(esc).join(' · ')}</div>`).join('')}</div>`;
 }
 $('#main').innerHTML=`<div class="end"><h2>Your Style Summary</h2>
 <div class="stats">${stats}</div>
 ${r.loved&&r.loved.length?`<h3>❤ Loved</h3><div class="catlist">${r.loved.map(esc).join(' · ')}</div>`:''}
 <h3>Tags You Lean Toward</h3><div class="bars">${r.top_tags.map(x=>bar(x,'var(--ok)')).join('')||'<span class="hint">None yet</span>'}</div>
 <h3>Tags You Avoid</h3><div class="bars">${r.avoided_tags.map(x=>bar(x,'var(--no)')).join('')||'<span class="hint">None yet</span>'}</div>
 ${cats}
 ${notesSection(r)}
 <h3>Send Results Back</h3><div class="hint" style="text-align:left;padding:0">Download the JSON file, or copy the text below and paste it into a chat with your agent.</div>
 <div class="btnrow"><button class="primary mw-hover" id="eDl">⬇ Export JSON</button><button class="mw-hover" id="eCp">Copy JSON</button><button class="sharebtn mw-hover" id="eSh">⇪ Share</button><button class="mw-hover" id="eBack">↶ Back To Last Card</button><button class="mw-hover" id="eReset">Start Over</button></div>
 <textarea id="resText" readonly>${esc(JSON.stringify(r,null,1))}</textarea></div>`;
 wireNotesSection();$('#eDl').onclick=download;$('#eCp').onclick=copy;$('#eSh').onclick=share;$('#eBack').onclick=undo;
 $('#eReset').onclick=()=>{if(confirm('Clear all answers for this deck?')){picks=[];idx=0;save();render()}};
}

/* ---------- Notes on Votes: private, localStorage only (never in the deck, page or repo) ---------- */
const notesKey=()=>`styleSwipe:notes:${deck.date}`;
function readNotes(){try{const n=JSON.parse(localStorage.getItem(notesKey())||'{}');return n&&typeof n==='object'?n:{}}catch(_){return {}}}
function writeNotes(n){try{localStorage.setItem(notesKey(),JSON.stringify(n))}catch(_){}}
function noteOf(id){const n=readNotes()[id];return n&&n.note?n.note:''}
function itemLabel(it){return single?it.option.label:`${it.optionA.label} vs ${it.optionB.label}`}
function noteBtn(id){const has=!!noteOf(id);return `<button type="button" class="notebtn mw-hover${has?' has':''}" aria-label="${has?'Edit note':'Add note'}" title="E: note"><span class="ni">${has?'📝':'✎'}</span>${has?'Note':'Add Note'}</button>`}
let noteFor=null,noteAfter=null;
function updateNoteUi(flash){const el=$('#noteSaved');if(!el)return;const it=deck&&idx<items.length?items[idx]:null,has=!!(it&&noteOf(it.id));
 el.classList.toggle('on',has);if(has&&flash){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
 ['#bNote','#bNote3'].forEach(q=>{const b=$(q);if(b){b.classList.toggle('has',has);b.textContent=has?'📝 Edit Note':'✎ Add Note'}})}
function noteCtl(){if(deck&&idx<items.length)openNote(items[idx].id)}
function openNote(id,after){const it=items.find(x=>x.id===id);if(!it)return;noteFor=id;noteAfter=after||null;
 $('#noteTitle').textContent=noteOf(id)?'Edit Note':'Add Note';$('#noteSub').textContent=`${it.category} · ${itemLabel(it)}`;
 $('#noteText').value=noteOf(id);$('#noteDel').style.display=noteOf(id)?'':'none';$('#noteSheet').classList.add('on');setTimeout(()=>$('#noteText').focus(),30)}
function closeNote(){$('#noteText').blur();$('#noteSheet').classList.remove('on');noteFor=null;const f=noteAfter;noteAfter=null;if(f)f();else if(deck&&idx<items.length){const c=$('#card');if(c){const it=items[idx];const nb=c.querySelector('.notebtn');if(nb){nb.outerHTML=noteBtn(it.id);const n2=c.querySelector('.notebtn');n2.onclick=e=>{e.stopPropagation();openNote(it.id)}}}updateNoteUi(true)}}
function setNote(id,txt){const n=readNotes();txt=(txt||'').trim();if(txt)n[id]={note:txt,at:new Date().toISOString()};else delete n[id];writeNotes(n);
 const p=picks.find(x=>(x.pair_id||x.card_id)===id);if(p){if(txt)p.note=txt;else delete p.note;save()}}
function withNotes(r){const n=readNotes();
 (r.picks||[]).forEach(p=>{const id=p.pair_id||p.card_id;if(n[id])p.note=n[id].note;else delete p.note});
 r.notes=Object.entries(n).filter(([id])=>items.some(x=>x.id===id)).map(([id,v])=>{const it=items.find(x=>x.id===id),p=picks.find(x=>(x.pair_id||x.card_id)===id);
  return {[single?'card_id':'pair_id']:id,category:it.category,label:itemLabel(it),answer:p?(p.choice||p.answer):null,note:v.note,at:v.at}});
 return r}
function notesSection(r){const ns=r.notes||[];
 const opts=items.filter(it=>!noteOf(it.id)).map(it=>`<option value="${esc(it.id)}">${esc(itemLabel(it)).slice(0,70)}</option>`).join('');
 return `<h3>Your Notes</h3><div class="notes-list">${ns.map(n=>{const id=n.pair_id||n.card_id;return `<div><span class="nt"><b>${esc(n.label)}</b>${n.answer?` · ${esc(n.answer)}`:''}<i>${esc(n.note)}</i></span><button class="notebtn has mw-hover" data-note="${esc(id)}"><span class="ni">📝</span>Edit</button></div>`}).join('')||'<div class="hint" style="padding:0;text-align:left">No notes yet. Notes are optional.</div>'}</div>
 ${opts?`<div class="notes-add"><select id="noteAddSel" aria-label="Pick a pair to add a note to">${opts}</select><button class="notebtn mw-hover" id="noteAddBtn"><span class="ni">✎</span>Add Note</button></div>`:''}`}
function wireNotesSection(){document.querySelectorAll('.notes-list [data-note]').forEach(b=>b.onclick=()=>openNote(b.dataset.note,showEnd));
 const ab=$('#noteAddBtn');if(ab)ab.onclick=()=>openNote($('#noteAddSel').value,showEnd)}
$('#noteSave').onclick=()=>{if(noteFor){setNote(noteFor,$('#noteText').value);toast('Note saved')}closeNote()};
$('#noteCancel').onclick=()=>closeNote();
$('#noteDel').onclick=()=>{if(noteFor){setNote(noteFor,'');toast('Note deleted')}closeNote()};
$('#noteSheet').addEventListener('click',e=>{if(e.target.id==='noteSheet')closeNote()});

/* ---------- wiring ---------- */
$('#bA').onclick=()=>choose('A');$('#bB').onclick=()=>choose('B');$('#bN').onclick=()=>choose('neither');$('#bBoth').onclick=()=>choose('both');$('#bSkip').onclick=()=>{setLove(false);choose('skip')};$('#bU').onclick=()=>{setLove(false);undo()};
$('#bLoveP').onclick=()=>{setLove(!loveArmed);if(loveArmed)toast('Now tap the option you love')};
$('#bNo').onclick=()=>answer('no');$('#bMaybe').onclick=()=>answer('maybe');$('#bLove').onclick=()=>answer('love');$('#bYes').onclick=()=>answer('yes');$('#bU3').onclick=undo;
$('#btnExportTop').onclick=()=>{if(deck)download()};
$('#shareBtn').onclick=share;$('#bNote').onclick=noteCtl;$('#bNote3').onclick=noteCtl;
document.addEventListener('keydown',e=>{if($('#noteSheet').classList.contains('on')){if(e.key==='Escape')closeNote();return}if(e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'||!deck)return;const k=e.key;if(k==='e'&&!e.metaKey&&!e.ctrlKey&&idx<items.length){e.preventDefault();openNote(items[idx].id);return}
 if(k==='Backspace'||k==='z'){e.preventDefault();return undo()}
 if(single){if(k==='s')answer('skip');else if(k==='ArrowLeft')answer('no');else if(k==='ArrowRight')answer('yes');else if(k==='m'||k==='ArrowDown')answer('maybe');else if(k==='l'||k==='ArrowUp')answer('love');return}
 if(k==='ArrowLeft')choose('A');else if(k==='ArrowRight')choose('B');else if(k==='ArrowDown'||k==='n')choose('neither');else if(k==='b'||k==='ArrowUp')choose('both');else if(k==='s')choose('skip');else if(k==='l')setLove(!loveArmed);else if(k==='Escape')setLove(false)});
$('#deckFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.pairs&&!d.cards)throw 0;setDeck(d);toast(`Loaded deck ${d.date}`)}catch(_){toast('Not a valid deck file')}};
$('#creditsLink').onclick=e=>{e.preventDefault();const c=(deck&&deck.image_credits)||{};$('#main').innerHTML=`<div class="end"><h2>Image Credits</h2><div class="catlist">${Object.values(c).map(x=>`<div><a style="color:#05668D" href="${esc(x.source)}" target="_blank" rel="noopener">${esc(x.title)}</a> · ${esc(x.artist||'Unknown')} · ${esc(x.license)}</div>`).join('')||'None'}</div><div class="btnrow"><button class="mw-hover" id="cBack">Back</button></div></div>`;showControls(false);$('#cBack').onclick=()=>render()};
(async()=>{
 const want=new URLSearchParams(location.search).get('date');
 if(want&&(!EMBEDDED_DECK||EMBEDDED_DECK.date!==want)){try{const r=await fetch(`decks/${want}.json`,{cache:'no-cache'});if(r.ok)return setDeck(await r.json())}catch(_){}toast(`Deck ${want} not found; showing embedded deck`)}
 if(EMBEDDED_DECK)return setDeck(EMBEDDED_DECK);
 try{const r=await fetch(`decks/${new Date().toISOString().slice(0,10)}.json`);if(r.ok)return setDeck(await r.json())}catch(_){}
 $('#sub').textContent='No deck found. Use "Load Another Deck" below.';
})();
</script>
</body>
</html>
