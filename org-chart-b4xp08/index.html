<style>
:root{color-scheme:light;--bg:#FAF3EB;--panel:#FFFDF7;--line:#E4D6C4;--text:#1F1F1F;--muted:#6B5E50;--a:#05668D;--b:#C1502E;--ok:#0B6E4F;
 --no:#A4161A;--maybe:#D4A017;--maybe-dk:#9A6F00;--love:#E0245E;--yes:#0B6E4F;--terracotta:#C1502E;--lagoon:#05668D}
/* Max Weberman brand hover motion (brand-tokens.css .mw-hover) */
:root{--mw-ease:cubic-bezier(.2,.8,.2,1);--mw-dur:180ms}
.mw-hover{transition:transform var(--mw-dur) var(--mw-ease),box-shadow var(--mw-dur) var(--mw-ease),background-color var(--mw-dur) var(--mw-ease)}
@media (hover:hover){.mw-hover:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 6px 18px rgba(10,10,10,.12)}}
.mw-hover:focus-visible{transform:translateY(-1px) scale(1.03);box-shadow:0 6px 18px rgba(10,10,10,.12)}
.mw-hover:active{transform:scale(.98)}
.card.mw-card{transition:transform .25s ease,opacity .25s,box-shadow var(--mw-dur) var(--mw-ease)}
@media (hover:hover){.card.mw-card:not(.dragging):hover{box-shadow:0 10px 26px rgba(80,50,20,.14)}}
@media (prefers-reduced-motion:reduce){.mw-hover,.mw-hover:hover,.mw-hover:focus-visible{transition:none;transform:none}}
h1,h2,.card h2{font-family:Khand,Inter,sans-serif;letter-spacing:.01em}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Hind,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;min-height:100dvh}
.mw-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;padding:0 12px;border:2px solid #1F1F1F;background:#fff;color:#1F1F1F;text-decoration:none;font:700 15px/1 Khand,Hind,sans-serif;letter-spacing:.08em;text-transform:uppercase}
header{padding:12px 16px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;letter-spacing:.01em}
header .sub{color:var(--muted);font-size:12px}
.progress{flex:1 1 100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--terracotta),var(--lagoon));transition:width .3s}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 10px 10px;overflow:hidden}
.stage{position:relative;width:100%;max-width:760px;flex:1;display:flex;min-height:0}
.card{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;user-select:none;transition:transform .25s ease, opacity .25s;overflow:hidden}
.card.dragging{will-change:transform}
.card.dragging{transition:none}
.card .cat{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.card h2{margin:0;font-size:16px;font-weight:700}
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.opt{position:relative;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;cursor:pointer;transition:border-color .15s, box-shadow .15s, transform .15s;background:#FFFFFF}
.opt:hover{border-color:#cdb9a0}
.opt.hot-a{border-color:var(--a);box-shadow:0 0 0 3px rgba(76,201,240,.25)}
.opt.hot-b{border-color:var(--b);box-shadow:0 0 0 3px rgba(247,37,133,.25)}
.opt .side{font-size:10px;font-weight:800;letter-spacing:.1em}
.opt.A .side{color:var(--a)}.opt.B .side{color:var(--b)}
.opt h3{margin:2px 0 0;font-size:14px;line-height:1.2}
.opt p{margin:0;color:var(--muted);font-size:12px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;padding:2px 6px;border-radius:999px;background:#F1E6D6;color:#4A3F35}
.vis{border-radius:10px;overflow:hidden;flex:0 0 auto;min-height:120px;position:relative;background:#EFE6D8}
.stamp{position:absolute;top:40%;font-size:28px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:10px;opacity:0;transform:rotate(-12deg);pointer-events:none;z-index:5;background:rgba(0,0,0,.35)}
.stamp.l{left:16px;color:var(--a)}.stamp.r{right:16px;color:var(--b);transform:rotate(12deg)}
.controls{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;max-width:760px;width:100%;margin:0 auto;padding:10px 10px calc(12px + env(safe-area-inset-bottom))}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer;min-width:64px}
button:active{transform:scale(.97)}
button.a{border-color:var(--a);color:var(--a)}button.b{border-color:var(--b);color:var(--b)}
button.primary{background:linear-gradient(90deg,var(--terracotta),var(--lagoon));border:0;color:#fff}
button.small{padding:8px 10px;font-size:13px;min-width:0}
.hint{color:var(--muted);font-size:11px;text-align:center;padding:0 10px}
/* visual renderers */
.v-ui{padding:10px;height:100%;min-height:150px;display:flex;flex-direction:column;gap:8px}
.v-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}

.v-pal{display:flex;height:150px}

.v-tone{background:#f3f4f6;color:#111;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:150px;font-size:13px;line-height:1.35}
.v-tone .msg{background:#fff;border-radius:12px 12px 12px 3px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.v-tone .from{font-size:10px;color:#6b7280;font-weight:600}
.v-img img{width:100%;height:170px;object-fit:cover;display:block}
.sw{display:flex;gap:4px;padding:6px;background:#EFE6D8}.sw span{flex:1;height:14px;border-radius:4px}
.mats{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px 6px;background:#EFE6D8}
.v-mood{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:52px;gap:3px;padding:3px;background:#EFE6D8}
.v-mood div:first-child{grid-row:span 2}
.v-mood .m{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#111;background:#f2f2f2;border-radius:3px;text-align:center;padding:2px}
.v-logo{height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.v-logo .mk{width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative}
.v-logo .wd{font-size:20px;text-align:center;line-height:1}
.v-thumb{position:relative;aspect-ratio:16/9;overflow:hidden}
.v-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v-thumb .ov{position:absolute;inset:0;display:flex;padding:8px}
/* new renderers */
.v-hero{position:relative;padding:7px;min-height:160px;display:flex;flex-direction:column;overflow:hidden}
.v-post{position:relative;aspect-ratio:1;padding:10px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.v-pace{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:center}
.v-merch{height:160px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#f4f4f4,#cfcfcf)}
/* round-3 formats */
.opt.fmt-bleed .vis{height:250px}
.v-bleed{position:absolute;inset:0}.v-bleed img{width:100%;height:100%;object-fit:cover;display:block}
.v-bleed .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;font-weight:700}

.v-word{height:100%;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.v-mini{height:100%;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
.v-mini .ic{font-size:46px;line-height:1}.v-mini .its{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.v-mini .its span{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.08)}
.v-motion{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
.v-motion .mlab{font:9px 'IBM Plex Mono',monospace;text-align:center;padding:0 4px;word-break:break-all}
@keyframes mo-slide{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@keyframes mo-fade{from{opacity:.1}to{opacity:1}}
@keyframes mo-scale{from{transform:scale(.2)}to{transform:scale(1.1)}}
@keyframes mo-bounce{from{transform:translateY(20px) scale(1.2,.8)}to{transform:translateY(-25px) scale(.9,1.1)}}
@keyframes mo-wiggle{from{transform:rotate(-6deg) translateY(1px)}to{transform:rotate(6deg) translateY(-1px)}}
@keyframes mo-zoom{from{transform:scale(.8);opacity:.5}to{transform:scale(1.4);opacity:1}}
@keyframes mo-glitch{0%{transform:translate(0)}25%{transform:translate(-4px,2px);filter:hue-rotate(90deg)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,0);filter:hue-rotate(-90deg)}100%{transform:translate(0)}}
@keyframes mo-type{from{width:0}to{width:14ch}}
.v-sound{min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px}
.v-sound .eq{animation-play-state:paused}.v-sound:not(.playing) .eq i{animation-play-state:paused}
.play{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;font-size:18px;font-weight:800;border-radius:14px;border:0;background:#05668D;color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.4);touch-action:manipulation;cursor:pointer}
.play .pi{font-size:20px}.v-sound.playing .play{background:#0B6E4F;color:#fff}
.silent{color:#6E4F00;font-weight:700}
.v-sound .eq{display:flex;align-items:flex-end;gap:3px;height:60px}.v-sound .eq i{flex:1;border-radius:2px}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}.v-sound .eq i{transform-origin:bottom}
.v-thai{padding:12px;min-height:150px}
.v-texture{height:160px;display:flex;align-items:flex-end;justify-content:flex-end}
.v-texture span,.v-light span{font:600 10px 'IBM Plex Mono',monospace;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;margin:6px;border-radius:4px}
.v-light{height:160px;position:relative;display:flex;align-items:flex-end;justify-content:flex-end}
.v-light .room{position:absolute;left:12%;right:12%;bottom:0;height:28%;background:rgba(0,0,0,.25);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.v-cover-wrap{padding:8px;background:#e9e4d8;display:flex;justify-content:center}
.v-cover{position:relative;width:118px;aspect-ratio:2/3;padding:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:3px 4px 10px rgba(0,0,0,.35)}
.v-sign{height:150px;display:flex;align-items:center;justify-content:center}
/* single-card mode (v3) */
.opts.single{grid-template-columns:1fr;overflow:auto}
.opts.single .opt{cursor:grab;max-width:520px;width:100%;margin:0 auto}
.opts.single .opt .vis{min-height:180px}
.opts.single .opt h3{font-size:18px}.opts.single .opt p{font-size:13px}
.stamp.no{right:16px;color:var(--no);border-color:var(--no);transform:rotate(12deg)}.stamp.yes{left:16px;color:var(--yes);border-color:var(--yes)}
.stamp.maybe{left:50%;top:22%;transform:translateX(-50%) rotate(-4deg);color:#9A6F00;border-color:#9A6F00}
.stamp.love{left:50%;top:22%;transform:translateX(-50%) rotate(4deg);color:var(--love);border-color:var(--love)}
.stamp{background:rgba(255,255,255,.92)!important;transition:opacity .12s}
.controls.v3 button{font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-width:2px}
button.no{background:#FBE8E7;border-color:var(--no);color:#A4161A}
button.maybe{background:#D4A017;border-color:#B88A0E;color:#1F1F1F}
button.love{background:#FDE8EF;border-color:var(--love);color:#9E1240}button.love .h{color:var(--love);font-size:18px}

.ans{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;margin-right:3px;color:#fff}
.ans.love{background:var(--love)}.ans.yes{background:var(--yes)}.ans.maybe{background:var(--maybe);color:#111}.ans.no{background:var(--no)}
/* responsive: phone-first, centered card, 44px tap targets */
body.single .stage{max-width:520px;max-height:640px}
body.single .controls{max-width:540px}
.opts.single .opt{min-height:100%}
#btnExportTop{min-height:44px;min-width:64px}
footer label,footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px}
.end .btnrow button{min-height:44px}
/* capsule pill controls (Max pick, daily 2026-10-13) */
.controls.v3 button,.controls.v4 button{border-radius:999px}

button.both{background:#E2F2EB;border-color:var(--yes);color:#0B6E4F}

button.love.armed{background:var(--love);color:#fff}button.love.armed .h{color:#fff}
.opt.A .side{color:#044F6D}.opt.B .side{color:#8E3518}
.opt.hot-a{border-color:var(--lagoon);box-shadow:0 0 0 3px rgba(5,102,141,.35)}
.opt.hot-b{border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(193,80,46,.35)}
.card.love-armed .opt{border-color:var(--love);box-shadow:0 0 0 3px rgba(224,36,94,.25)}
.stamp.l{right:16px;color:var(--lagoon);border-color:var(--lagoon);transform:rotate(12deg)}.stamp.r{left:16px;color:var(--terracotta);border-color:var(--terracotta);transform:rotate(-12deg)}
.stamp.both{left:50%;top:22%;transform:translateX(-50%) rotate(-4deg);color:var(--yes);border-color:var(--yes)}
.stamp.neither{left:50%;top:22%;transform:translateX(-50%) rotate(4deg);color:var(--no);border-color:var(--no)}
.stamp.lovea{left:16px;top:22%;color:var(--love);border-color:var(--love)}.stamp.loveb{right:16px;top:22%;color:var(--love);border-color:var(--love);transform:rotate(8deg)}
body.pairs .stage{max-width:760px;max-height:620px}
@media (max-width:420px){.controls.v4 .row1 button{font-size:12px;letter-spacing:.02em}}
/* swipe controls mock (category: Swipe Controls) */
.v-ctl{container-type:inline-size;position:relative;height:190px;padding:8px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.v-ctl .scr{flex:1;border-radius:10px;background:linear-gradient(135deg,rgba(0,0,0,.08),rgba(0,0,0,.18));position:relative;overflow:hidden}
.v-ctl .scr .ph{position:absolute;inset:10px 30% 10px 10px;border-radius:8px;background:rgba(255,255,255,.35);animation:ctlcard 3.2s ease-in-out infinite}
@keyframes ctlcard{0%,20%{transform:none}40%{transform:translateX(30%) rotate(6deg)}60%,100%{transform:none}}
.v-ctl .bar{display:flex;gap:min(5px,1.2cqw);justify-content:center;align-items:flex-end}
.v-ctl .b{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.05;text-align:center;animation:ctlpress 3.2s ease-in-out infinite;white-space:nowrap;flex:0 1 auto;min-width:0}
.v-ctl .b small{font-size:8px;font-weight:600;opacity:.85}

.pill.app{background:#FFFFFF;color:#0A0A0A;border-color:#0A0A0A}
.opt{border-color:#E5E0D8;background:#FFFFFF}
.opt:hover{border-color:#BDB6AA}
.vis{background:#FDFBF6}
.tag{background:#F5F3EF;color:#525252}
.notebtn{border-color:#E5E0D8;color:#0A0A0A}
.controls.v3 button,.controls.v4 button{border-radius:10px}

#noteSheet textarea:focus{outline:2px solid #05668D;outline-offset:1px}

#noteSheet .nrow button.save{background:#0B6E4F;border-color:#0B6E4F;color:#FFFFFF}
.stat{background:#FFFFFF;border-color:#E5E0D8}
.sharebtn{background:#FFFFFF;border-color:#0A0A0A;color:#0A0A0A}
.sharebtn:hover{background:#0A0A0A;color:#FFFFFF}
.mw-share{border-radius:8px}
footer,.builtby{background:#FDFBF6;color:#525252;border-top:1px solid #E5E0D8}
footer a,.builtby a{color:#0A0A0A}
.v-svg{background:#FDFBF6!important}

/* crisp pass (Oct 14): no idle compositing layer on cards (Chrome rasterised the layer and scaled it -> blurry SVG text); vector text rendering; bigger cards + readable Khand/Hind on desktop */
.v-svg svg,.v-svg svg text{text-rendering:geometricPrecision;shape-rendering:geometricPrecision}
@media (min-width:900px) and (min-height:700px){
 body.carding .stage{max-width:min(1080px,92vw)}
 body.carding .controls{max-width:760px}
 body.carding header h1{font-size:20px}
 body.carding header .sub{font-size:14px}
 body.carding .card .cat .pill{font-size:12px}
 body.carding .card .notebtn{font-size:13px}
 body.carding .card h2{font-size:20px}
 body.carding .opt .side{font-size:12px}
 body.carding .opt h3{font-size:16px!important}
 body.carding .opt p{font-size:14px!important}
 body.carding .opt .vis img{max-width:960px;margin:0 auto}
}
@media (min-width:1800px) and (min-height:1100px){
 body.carding .stage{max-width:1400px}
 body.carding .controls{max-width:860px}
 body.carding header h1{font-size:22px}
 body.carding .card h2{font-size:24px}
 body.carding .opt h3{font-size:18px!important}
 body.carding .opt p{font-size:15px!important}
}

const IC={heart:'<svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',pen:'<svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>',undo:'<svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',down:'<svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>',share:'<svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>',check:'<svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',x:'<svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',left:'<svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',right:'<svg class="ic" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'};
/* Pull-to-refresh guard: the summary scrolls inside .end, so do not refresh while an inner scroller is not at its top */
document.addEventListener('touchstart',e=>{for(let el=e.target;el&&el!==document.body;el=el.parentElement){if(el.scrollTop>0){e.stopPropagation();return}}},{passive:true});
/* Back link: ?from= only https://webermanapps.github.io/... */
(function(){try{const f=new URLSearchParams(location.search).get('from');if(!f)return;const u=new URL(f);
 if(u.protocol==='https:'&&u.hostname==='webermanapps.github.io')document.getElementById('backLink').href=u.href}catch(_){}})();
const EMBEDDED_DECK = /*__DECK_JSON__*/null;
const EMBEDDED_IMAGES = /*__IMAGES_JSON__*/{};
const EMBEDDED_AUDIO = /*__AUDIO_JSON__*/{};
const audioSrc = id => EMBEDDED_AUDIO[id] || `audio/${id}.mp3`;
let deck = null, picks = [], idx = 0, shownAt = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imgSrc = k => EMBEDDED_IMAGES[k] || `img/${k}.jpg`;
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1600)}

/* ---------- visual renderers ---------- */
function shadowCss(s){return {soft:'0 4px 14px rgba(0,0,0,.12)',neu:'6px 6px 12px #c8cbd2,-6px -6px 12px #ffffff',glow:'0 0 0 1px rgba(45,212,191,.25),0 0 18px rgba(45,212,191,.15)',hard:'4px 4px 0 #000',none:'none'}[s]||'none'}
function rUI(v){const r=v.radius+'px', sh=shadowCss(v.shadow), br=v.border||'none';
 return `<div class="v-ui" style="background:${v.bg};color:${v.text};font-family:${v.font}">
  <div class="bar"><span>Weberman</span><span class="dot" style="background:${v.accent}"></span></div>
  <div class="cardm" style="background:${v.surface};border-radius:${r};box-shadow:${sh};border:${br}">
   <div style="font-weight:700;font-size:14px">Unit 4B · Riverside</div>
   <div style="font-size:11px;opacity:.75">Rent received · Inspection Fri 10:00</div>
   <div class="row"><span class="chip" style="border-radius:${r};border:${br==='none'?'1px solid '+v.accent:br};color:${v.text}">Occupied</span><span class="chip" style="border-radius:${r};background:${v.accent}22;color:${v.text}">94%</span></div>
   <span class="btn" style="background:${v.accent};color:${/linear|#0|#1|#2|#3/.test(v.accent)?'#fff':'#111'};border-radius:${r};${v.shadow==='hard'?'box-shadow:3px 3px 0 #000;border:2px solid #000':''}">Open Work Order</span>
  </div></div>`}
function rPal(v){return `<div class="v-pal">${v.colors.map(c=>`<div style="background:${c};color:${lum(c)>.55?'#111':'#fff'}">${c}</div>`).join('')}</div>`}
function lum(h){h=h.replace('#','');if(h.length<6)return .5;const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);return .299*r+.587*g+.114*b}
function rType(v){return `<div class="v-type"><div class="h" style="font-family:${v.head};font-weight:${v.headWeight};${v.upper?'text-transform:uppercase;':''}letter-spacing:${v.tracking}">A Moment In Thai</div>
 <div class="s" style="font-family:${v.body}">Weberman Construction · Est. 2026</div>
 <div class="b" style="font-family:${v.body}">We build homes that hold up to monsoon season, and we show you every step of how it's done. 0123456789</div></div>`}
function rTone(v){return `<div class="v-tone"><div class="from">${esc(v.from||'Max → Client')}</div>${v.lines.filter(Boolean).map(l=>`<div class="msg">${esc(l)}</div>`).join('')}</div>`}
function swatches(v){return (v.colors&&v.colors.length?`<div class="sw">${v.colors.map(c=>`<span style="background:${c}"></span>`).join('')}</div>`:'')+(v.materials&&v.materials.length?`<div class="mats">${v.materials.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}</div>`:'')}
function rImg(v){return `<div class="v-img"><img alt="" loading="lazy" src="${imgSrc(v.key)}" style="filter:${v.filter||'none'}" onerror="this.style.display='none'">${swatches(v)}</div>`}
function rMood(v){const c=v.colors, m=v.materials||[];
 const cells=[`<div style="background:${c[0]}"></div>`];
 for(let i=1;i<c.length;i++) cells.push(`<div style="background:${c[i]}"></div>`);
 m.forEach((x,i)=>cells.push(`<div class="m" style="background:${c[(i+1)%c.length]};color:${lum(c[(i+1)%c.length])>.55?'#111':'#fff'}">${esc(x)}</div>`));
 return `<div class="v-mood">${cells.join('')}</div>`}
function rLogo(v){const s=v.shape;let st=`font-family:${v.font};font-weight:${v.weight};color:${v.fg};`;
 let mk='';
 if(v.mark){let ms='';
  if(s==='circle') ms=`background:${v.fg};color:${v.bg};border-radius:50%`;
  else if(s==='square') ms=`background:${v.fg};color:${v.bg};border-radius:4px;transform:rotate(-3deg)`;
  else if(s==='rounded') ms=`background:${v.fg};color:${v.bg};border-radius:18px 4px 18px 4px`;
  else if(s==='shield') ms=`background:${v.fg};color:${v.bg};clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);height:72px`;
  else if(s==='ring') ms=`border:2px solid ${v.fg};border-radius:50%;box-shadow:inset 0 0 0 5px ${v.bg},inset 0 0 0 6px ${v.fg}`;
  else if(s==='outline') ms=`border:2px solid ${v.fg};color:transparent;-webkit-text-stroke:1.5px ${v.fg};background-image:linear-gradient(${v.fg}22 1px,transparent 1px),linear-gradient(90deg,${v.fg}22 1px,transparent 1px);background-size:8px 8px`;
  else if(s==='house') ms=`background:${v.fg};color:${v.bg};clip-path:polygon(50% 0,100% 38%,100% 100%,0 100%,0 38%);height:70px;padding-top:16px`;
  else if(s==='hex') ms=`background:${v.fg};color:${v.bg};clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);width:70px`;
  else if(s==='split') ms=`background:linear-gradient(135deg,${v.accent} 50%,${v.fg} 50%);color:${v.bg};border-radius:3px`;
  mk=`<div class="mk" style="font-family:${v.font};font-weight:${v.weight};${ms}">${esc(v.mark)}</div>`}
 if(s==='bilingual'){const [en,th]=v.word.split('|');return `<div class="v-logo" style="background:${v.bg}"><div class="wd" style="${st}letter-spacing:${v.spacing}">${esc(en)}</div><div style="height:2px;width:60%;background:${v.accent}"></div><div style="font-family:${v.font};color:${v.accent};font-size:16px">${esc(th)}</div></div>`}
 const deco=s==='underline'?`border-bottom:6px solid ${v.accent};padding-bottom:4px;`:'';
 const sun=s==='sun'?`<div style="width:90px;height:45px;border-radius:90px 90px 0 0;background:${v.accent};margin-bottom:-14px"></div>`:'';
 const word=`${sun}<div class="wd" style="${st}${deco}letter-spacing:${v.spacing};${v.upper?'text-transform:uppercase;':''}${v.italic?'font-style:italic;':''}${/Caveat/.test(v.font)?'font-size:32px;':''}">${esc(v.word).replace(/\.$/,`<span style="color:${v.accent}">.</span>`)}</div>`;
 return `<div class="v-logo" style="background:${v.bg}">${mk}${word}</div>`}
function rThumb(v){const im=v.key?`<img alt="" src="${imgSrc(v.key)}" style="filter:${v.filter||'none'}">`:'';const f=`font-family:${v.font};`;let ov='';
 switch(v.layout){
  case'bigtext':ov=`<div class="ov" style="align-items:flex-end"><div style="${f}font-size:34px;line-height:.9;color:${v.fg};text-shadow:3px 3px 0 #000"><span style="background:${v.accent};color:#000;padding:0 4px">${esc(v.text.split(' ')[0])}</span><br>${esc(v.text.split(' ').slice(1).join(' '))}</div></div>`;break;
  case'cinematic':ov=`<div class="ov" style="flex-direction:column;justify-content:space-between;padding:0"><div style="height:14%;background:#000"></div><div style="height:14%;background:#000"></div></div>`;break;
  case'split':ov=`<div class="ov" style="padding:0"><div style="flex:1;filter:grayscale(1) brightness(.6);background:rgba(0,0,0,.35)"></div><div style="width:3px;background:${v.accent}"></div><div style="flex:1"></div></div><div class="ov" style="align-items:flex-start;justify-content:center"><span style="${f}background:${v.accent};color:#000;padding:2px 8px;font-size:14px">${esc(v.text)}</span></div>`;break;
  case'lower':ov=`<div class="ov" style="align-items:flex-end;background:linear-gradient(transparent 50%,rgba(0,0,0,.75))"><div><div style="${f}font-size:22px;color:${v.fg}">${esc(v.text)}</div><div style="height:2px;width:40px;background:${v.accent};margin-top:4px"></div></div></div>`;break;

function stopAllAudio(){document.querySelectorAll('audio').forEach(a=>{a.pause();const w=a.closest('.v-sound');if(w){w.classList.remove('playing');const l=w.querySelector('.pl');if(l)l.textContent='Play';const i=w.querySelector('.pi');if(i)i.textContent='▶'}})}
function onPlayTap(e){const btn=e.target.closest&&e.target.closest('.play');if(!btn)return;
 e.preventDefault();e.stopPropagation();
 const wrap=btn.closest('.v-sound'),a=wrap.querySelector('audio');
 if(!a.paused){stopAllAudio();return}
 stopAllAudio();try{a.currentTime=0}catch(_){}
 a.muted=false;a.volume=1;
 const p=a.play();wrap.classList.add('playing');btn.querySelector('.pl').textContent='Stop';btn.querySelector('.pi').textContent='■';
 a.onended=()=>stopAllAudio();

['pointerdown','pointerup','click'].forEach(t=>document.addEventListener(t,e=>{if(e.target.closest&&e.target.closest('.play')){e.stopPropagation();if(t==='click')onPlayTap(e)}},true));

 const opts=items.filter(it=>!noteOf(it.id)).map(it=>`<option value="${esc(it.id)}">${esc(itemLabel(it)).slice(0,70)}</option>`).join('');
 return `<h3>Your Notes</h3><div class="notes-list">${ns.map(n=>{const id=n.pair_id||n.card_id;return `<div><span class="nt"><b>${esc(n.label)}</b>${n.answer?` · ${esc(n.answer)}`:''}<i>${esc(n.note)}</i></span><button class="notebtn has mw-hover" data-note="${esc(id)}"><span class="ni">${IC.pen}</span>Edit</button></div>`}).join('')||'<div class="hint" style="padding:0;text-align:left">No notes yet. Notes are optional.</div>'}</div>
 ${opts?`<div class="notes-add"><select id="noteAddSel" aria-label="Pick a pair to add a note to">${opts}</select><button class="notebtn mw-hover" id="noteAddBtn"><span class="ni">${IC.pen}</span>Add Note</button></div>`:''}`}
function wireNotesSection(){document.querySelectorAll('.notes-list [data-note]').forEach(b=>b.onclick=()=>openNote(b.dataset.note,showEnd));
 const ab=$('#noteAddBtn');if(ab)ab.onclick=()=>openNote($('#noteAddSel').value,showEnd)}
$('#noteSave').onclick=()=>{if(noteFor){setNote(noteFor,$('#noteText').value);toast('Note saved')}closeNote()};
$('#noteCancel').onclick=()=>closeNote();
$('#noteDel').onclick=()=>{if(noteFor){setNote(noteFor,'');toast('Note deleted')}closeNote()};
$('#noteSheet').addEventListener('click',e=>{if(e.target.id==='noteSheet')closeNote()});

$('#bA').onclick=()=>choose('A');$('#bB').onclick=()=>choose('B');$('#bN').onclick=()=>choose('neither');$('#bBoth').onclick=()=>choose('both');$('#bSkip').onclick=()=>{setLove(false);choose('skip')};$('#bU').onclick=()=>{setLove(false);undo()};
$('#bLoveP').onclick=()=>{setLove(!loveArmed);if(loveArmed)toast('Now tap the option you love')};
$('#bNo').onclick=()=>answer('no');$('#bMaybe').onclick=()=>answer('maybe');$('#bLove').onclick=()=>answer('love');$('#bYes').onclick=()=>answer('yes');$('#bU3').onclick=undo;
$('#btnExportTop').onclick=()=>{if(deck)download()};
$('#shareBtn').onclick=share;$('#bNote').onclick=noteCtl;$('#bNote3').onclick=noteCtl;
document.addEventListener('keydown',e=>{if($('#noteSheet').classList.contains('on')){if(e.key==='Escape')closeNote();return}if(e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'||!deck)return;const k=e.key;if(k==='e'&&!e.metaKey&&!e.ctrlKey&&idx<items.length){e.preventDefault();openNote(items[idx].id);return}
 if(k==='Backspace'||k==='z'){e.preventDefault();return undo()}
 if(single){if(k==='s')answer('skip');else if(k==='ArrowLeft')answer('no');else if(k==='ArrowRight')answer('yes');else if(k==='m'||k==='ArrowDown')answer('maybe');else if(k==='l'||k==='ArrowUp')answer('love');return}
 if(k==='ArrowLeft')choose('A');else if(k==='ArrowRight')choose('B');else if(k==='ArrowDown'||k==='n')choose('neither');else if(k==='b'||k==='ArrowUp')choose('both');else if(k==='s')choose('skip');else if(k==='l')setLove(!loveArmed);else if(k==='Escape')setLove(false)});
$('#deckFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.pairs&&!d.cards)throw 0;setDeck(d);toast(`Loaded deck ${d.date}`)}catch(_){toast('Not a valid deck file')}};
$('#creditsLink').onclick=e=>{e.preventDefault();const c=(deck&&deck.image_credits)||{};$('#main').innerHTML=`<div class="end"><h2>Image Credits</h2><div class="catlist">${Object.values(c).map(x=>`<div><a style="color:#05668D" href="${esc(x.source)}" target="_blank" rel="noopener">${esc(x.title)}</a> · ${esc(x.artist||'Unknown')} · ${esc(x.license)}</div>`).join('')||'None'}</div><div class="btnrow"><button class="mw-hover" id="cBack">Back</button></div></div>`;showControls(false);$('#cBack').onclick=()=>render()};

/* ---------- Mix mode: ?mix=slug1,slug2&n=20 (max 20) interleaves pairs from banks/<slug>.json ---------- */
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function loadBankIndex(){try{const r=await fetch('banks/index.json',{cache:'no-cache'});if(r.ok)return await r.json()}catch(_){}return {}}
async function buildMix(slugs,n){
 const idx=await loadBankIndex();const banks=[];
 for(const s of slugs){try{const r=await fetch(`banks/${encodeURIComponent(s)}.json`,{cache:'no-cache'});if(r.ok){const b=await r.json();if(Array.isArray(b.pairs)&&b.pairs.length)banks.push({slug:s,name:b.name||(idx[s]&&idx[s].name)||s,q:shuf(b.pairs)})}}catch(_){}}
 if(!banks.length)return null;
 const today=new Date().toISOString().slice(0,10),id=`mix-${banks.map(b=>b.slug).join('-')}-${today}`;
 const key='styleSwipe:'+id;let saved=null;try{saved=JSON.parse(localStorage.getItem(key+':mixorder')||'null')}catch(_){}
 const byId={};banks.forEach(b=>b.q.forEach(p=>{byId[p.id]=Object.assign({},p,{bank:b.slug})}));
 let pairs;
 if(Array.isArray(saved)&&saved.length&&saved.every(i=>byId[i]))pairs=saved.map(i=>byId[i]);
 else{pairs=[];const seen=new Set();
  while(pairs.length<n&&banks.some(b=>b.q.length)){for(const b of shuf(banks)){if(pairs.length>=n)break;let p;while(b.q.length&&(p=b.q.shift())&&seen.has(p.id))p=null;if(p){seen.add(p.id);pairs.push(byId[p.id])}}}
  try{localStorage.setItem(key+':mixorder',JSON.stringify(pairs.map(p=>p.id)))}catch(_){}}
 return {date:id,name:'Mixed Deck: '+banks.map(b=>b.name).join(' + '),mix:true,mix_slugs:banks.map(b=>b.slug),version:4,owner:'Max Weberman',pairs,deck_size:pairs.length,image_credits:{}};
}
async function offerBank(want){
 const idx=await loadBankIndex();const slugs=Object.keys(idx);if(!slugs.length)return false;
 const guess=slugs.find(s=>want.startsWith(s))||slugs.find(s=>want.includes(s.split('-')[0]));
 showControls(false);$('#sub').textContent=`Deck ${want} not found`;
 $('#main').innerHTML=`<div class="end"><h2>Deck Not Found</h2><p class="hint" style="text-align:left;padding:0">There is no deck called ${esc(want)}. Play 25 fresh pairs from a question bank instead.</p>
 ${guess?`<div class="btnrow"><a class="mw-hover" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;background:linear-gradient(90deg,var(--terracotta),var(--lagoon));color:#fff;font-weight:700;text-decoration:none" href="?mix=${encodeURIComponent(guess)}&n=25">Play From Bank: ${esc(idx[guess].name)}</a></div>`:''}
 <h3>Play From Bank</h3><div class="btnrow">${slugs.map(s=>`<a class="mw-hover" style="display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-weight:700;text-decoration:none" href="?mix=${encodeURIComponent(s)}&n=25">${esc(idx[s].name||s)}</a>`).join('')}</div></div>`;
 return true}
(async()=>{
 const qs=new URLSearchParams(location.search),want=qs.get('date')||window.DEFAULT_DECK,mix=qs.get('mix');
 if(mix){const slugs=mix.split(',').map(s=>s.trim()).filter(Boolean);const n=Math.max(1,Math.min(20,parseInt(qs.get('n'),10)||20));
  const d=await buildMix(slugs,n);if(d)return setDeck(d);toast(`Could not load bank(s) ${mix}`)}
 if(want&&(!EMBEDDED_DECK||EMBEDDED_DECK.date!==want)){try{const r=await fetch(`decks/${want}.json`,{cache:'no-cache'});if(r.ok)return setDeck(await r.json())}catch(_){}
  if(await offerBank(want))return;toast(`Deck ${want} not found; showing embedded deck`)}
 if(EMBEDDED_DECK)return setDeck(EMBEDDED_DECK);
 try{const r=await fetch(`decks/${new Date().toISOString().slice(0,10)}.json`);if(r.ok)return setDeck(await r.json())}catch(_){}
 $('#sub').textContent='No deck found. Use "Load Another Deck" below.';
})();
</script>
