<title>Style Swipe · Max Weberman</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&family=Playfair+Display:wght@700&family=DM+Serif+Display&family=Fraunces:wght@700&family=Lora:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Cormorant+Garamond:wght@600&family=Montserrat:wght@700;800&family=Work+Sans:wght@400;600&family=Oswald:wght@600&family=Bebas+Neue&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&family=Prompt:wght@400;600&family=Sarabun:wght@400&family=Caveat:wght@700&family=Kanit:wght@400;600;700&family=Mitr:wght@500&family=Chakra+Petch:wght@600;700&family=Pridi:wght@600&family=Noto+Serif+JP:wght@600&family=Noto+Sans+JP:wght@400&family=DM+Sans:wght@400;700&family=Syne:wght@800&family=Anton&family=Nunito:wght@800&family=Outfit:wght@700&family=Space+Mono:wght@700&family=Manrope:wght@800&family=Bai+Jamjuree:wght@600&family=IBM+Plex+Sans+Thai:wght@500&family=Noto+Serif+Thai:wght@500&family=Noto+Sans+Thai:wght@500&family=Taviraj:wght@500&family=Trirong:wght@500&family=Athiti:wght@600&family=Krub:wght@600&family=K2D:wght@600&family=Niramit:wght@500&family=Charm:wght@700&family=Chonburi&family=Itim&family=Sriracha&family=Mali:wght@600&family=Charmonman&family=Khand:wght@600;700&family=Hind:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#17140f;--panel:#221d17;--line:#3a3128;--text:#f4efe6;--muted:#b3a897;--a:#05668D;--b:#C1502E;--ok:#0B6E4F;
 --no:#A4161A;--maybe:#D4A017;--love:#E0245E;--yes:#0B6E4F;--terracotta:#C1502E;--lagoon:#05668D}
/* Max Weberman brand hover motion (brand-tokens.css .mw-hover) */
:root{--mw-ease:cubic-bezier(.2,.8,.2,1);--mw-dur:180ms}
.mw-hover{transition:transform var(--mw-dur) var(--mw-ease),box-shadow var(--mw-dur) var(--mw-ease),background-color var(--mw-dur) var(--mw-ease)}
@media (hover:hover){.mw-hover:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 6px 18px rgba(10,10,10,.12)}}
.mw-hover:focus-visible{transform:translateY(-1px) scale(1.03);box-shadow:0 6px 18px rgba(10,10,10,.12)}
.mw-hover:active{transform:scale(.98)}
.card.mw-card{transition:transform .25s ease,opacity .25s,box-shadow var(--mw-dur) var(--mw-ease)}
@media (hover:hover){.card.mw-card:not(.dragging):hover{box-shadow:0 10px 26px rgba(0,0,0,.35)}}
@media (prefers-reduced-motion:reduce){.mw-hover,.mw-hover:hover,.mw-hover:focus-visible{transition:none;transform:none}}
h1,h2,.card h2{font-family:Khand,Inter,sans-serif;letter-spacing:.01em}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Hind,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;min-height:100dvh}
header{padding:12px 16px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;letter-spacing:.01em}
header .sub{color:var(--muted);font-size:12px}
.progress{flex:1 1 100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--terracotta),var(--lagoon));transition:width .3s}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 10px 10px;overflow:hidden}
.stage{position:relative;width:100%;max-width:760px;flex:1;display:flex;min-height:0}
.card{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;user-select:none;transition:transform .25s ease, opacity .25s;will-change:transform;overflow:hidden}
.card.dragging{transition:none}
.card .cat{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.card h2{margin:0;font-size:16px;font-weight:700}
.opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.opt{position:relative;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;cursor:pointer;transition:border-color .15s, box-shadow .15s, transform .15s;background:#171a1f}
.opt:hover{border-color:#3d4450}
.opt.hot-a{border-color:var(--a);box-shadow:0 0 0 3px rgba(76,201,240,.25)}
.opt.hot-b{border-color:var(--b);box-shadow:0 0 0 3px rgba(247,37,133,.25)}
.opt .side{font-size:10px;font-weight:800;letter-spacing:.1em}
.opt.A .side{color:var(--a)}.opt.B .side{color:var(--b)}
.opt h3{margin:2px 0 0;font-size:14px;line-height:1.2}
.opt p{margin:0;color:var(--muted);font-size:12px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;padding:2px 6px;border-radius:999px;background:#262a31;color:#c9cfd8}
.vis{border-radius:10px;overflow:hidden;flex:0 0 auto;min-height:120px;position:relative;background:#0e1013}
.stamp{position:absolute;top:40%;font-size:28px;font-weight:900;padding:4px 14px;border:4px solid;border-radius:10px;opacity:0;transform:rotate(-12deg);pointer-events:none;z-index:5;background:rgba(0,0,0,.35)}
.stamp.l{left:16px;color:var(--a)}.stamp.r{right:16px;color:var(--b);transform:rotate(12deg)}
.controls{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;max-width:760px;width:100%;margin:0 auto;padding:10px 10px calc(12px + env(safe-area-inset-bottom))}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer;min-width:64px}
button:active{transform:scale(.97)}
button.a{border-color:var(--a);color:var(--a)}button.b{border-color:var(--b);color:var(--b)}
button.primary{background:linear-gradient(90deg,var(--a),var(--b));border:0;color:#0b0b0b}
button.small{padding:8px 10px;font-size:13px;min-width:0}
.hint{color:var(--muted);font-size:11px;text-align:center;padding:0 10px}
/* visual renderers */
.v-ui{padding:10px;height:100%;min-height:150px;display:flex;flex-direction:column;gap:8px}
.v-ui .bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.v-ui .dot{width:18px;height:18px;border-radius:50%}
.v-ui .cardm{padding:10px;display:flex;flex-direction:column;gap:6px}
.v-ui .btn{align-self:flex-start;padding:6px 12px;font-size:11px;font-weight:700}
.v-ui .row{display:flex;gap:6px}.v-ui .chip{font-size:10px;padding:3px 7px;opacity:.85}
.v-pal{display:flex;height:150px}
.v-pal div{flex:1;display:flex;align-items:flex-end;justify-content:center;font:600 9px/1 'IBM Plex Mono',monospace;padding-bottom:6px;writing-mode:vertical-rl;transform:rotate(180deg)}
.v-type{background:#faf8f3;color:#141414;padding:12px;min-height:150px}
.v-type .h{font-size:24px;line-height:1.05;margin-bottom:6px}
.v-type .s{font-size:13px;opacity:.7;margin-bottom:6px}
.v-type .b{font-size:12px;line-height:1.45}
.v-tone{background:#f3f4f6;color:#111;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:150px;font-size:13px;line-height:1.35}
.v-tone .msg{background:#fff;border-radius:12px 12px 12px 3px;padding:8px 10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.v-tone .from{font-size:10px;color:#6b7280;font-weight:600}
.v-img img{width:100%;height:170px;object-fit:cover;display:block}
.sw{display:flex;gap:4px;padding:6px;background:#0e1013}.sw span{flex:1;height:14px;border-radius:4px}
.mats{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px 6px;background:#0e1013}
.v-mood{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:52px;gap:3px;padding:3px;background:#0e1013}
.v-mood div:first-child{grid-row:span 2}
.v-mood .m{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#111;background:#f2f2f2;border-radius:3px;text-align:center;padding:2px}
.v-logo{height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.v-logo .mk{width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative}
.v-logo .wd{font-size:20px;text-align:center;line-height:1}
.v-thumb{position:relative;aspect-ratio:16/9;overflow:hidden}
.v-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v-thumb .ov{position:absolute;inset:0;display:flex;padding:8px}
/* new renderers */
.v-hero{position:relative;padding:7px;min-height:160px;display:flex;flex-direction:column;overflow:hidden}
.v-post{position:relative;aspect-ratio:1;padding:10px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.v-pace{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:center}
.v-merch{height:160px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#f4f4f4,#cfcfcf)}
/* round-3 formats */
.opt.fmt-bleed .vis{height:250px}
.v-bleed{position:absolute;inset:0}.v-bleed img{width:100%;height:100%;object-fit:cover;display:block}
.v-bleed .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;font-weight:700}

.v-word{height:100%;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.v-mini{height:100%;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
.v-mini .ic{font-size:46px;line-height:1}.v-mini .its{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.v-mini .its span{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.08)}
.v-motion{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
.v-motion .mlab{font:9px 'IBM Plex Mono',monospace;text-align:center;padding:0 4px;word-break:break-all}
@keyframes mo-slide{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@keyframes mo-fade{from{opacity:.1}to{opacity:1}}
@keyframes mo-scale{from{transform:scale(.2)}to{transform:scale(1.1)}}
@keyframes mo-bounce{from{transform:translateY(20px) scale(1.2,.8)}to{transform:translateY(-25px) scale(.9,1.1)}}
@keyframes mo-wiggle{from{transform:rotate(-6deg) translateY(1px)}to{transform:rotate(6deg) translateY(-1px)}}
@keyframes mo-zoom{from{transform:scale(.8);opacity:.5}to{transform:scale(1.4);opacity:1}}
@keyframes mo-glitch{0%{transform:translate(0)}25%{transform:translate(-4px,2px);filter:hue-rotate(90deg)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,0);filter:hue-rotate(-90deg)}100%{transform:translate(0)}}
@keyframes mo-type{from{width:0}to{width:14ch}}
.v-sound{min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px}
.v-sound .eq{animation-play-state:paused}.v-sound:not(.playing) .eq i{animation-play-state:paused}
.play{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;font-size:18px;font-weight:800;border-radius:14px;border:0;background:#ffffff;color:#111;box-shadow:0 2px 0 rgba(0,0,0,.4);touch-action:manipulation;cursor:pointer}
.play .pi{font-size:20px}.v-sound.playing .play{background:#7bd88f}
.silent{color:#ffd166;font-weight:700}
.v-sound .eq{display:flex;align-items:flex-end;gap:3px;height:60px}.v-sound .eq i{flex:1;border-radius:2px}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}.v-sound .eq i{transform-origin:bottom}
.v-thai{padding:12px;min-height:150px}
.v-texture{height:160px;display:flex;align-items:flex-end;justify-content:flex-end}
.v-texture span,.v-light span{font:600 10px 'IBM Plex Mono',monospace;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;margin:6px;border-radius:4px}
.v-light{height:160px;position:relative;display:flex;align-items:flex-end;justify-content:flex-end}
.v-light .room{position:absolute;left:12%;right:12%;bottom:0;height:28%;background:rgba(0,0,0,.25);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.v-cover-wrap{padding:8px;background:#e9e4d8;display:flex;justify-content:center}
.v-cover{position:relative;width:118px;aspect-ratio:2/3;padding:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:3px 4px 10px rgba(0,0,0,.35)}
.v-sign{height:150px;display:flex;align-items:center;justify-content:center}
/* single-card mode (v3) */
.opts.single{grid-template-columns:1fr;overflow:auto}
.opts.single .opt{cursor:grab;max-width:520px;width:100%;margin:0 auto}
.opts.single .opt .vis{min-height:180px}
.opts.single .opt h3{font-size:18px}.opts.single .opt p{font-size:13px}
.stamp.no{right:16px;color:var(--no);border-color:var(--no);transform:rotate(12deg)}.stamp.yes{left:16px;color:var(--yes);border-color:var(--yes)}
.stamp.maybe{left:50%;top:22%;transform:translateX(-50%) rotate(-4deg);color:var(--maybe);border-color:var(--maybe)}
.stamp.love{left:50%;top:22%;transform:translateX(-50%) rotate(4deg);color:var(--love);border-color:var(--love)}
.stamp{background:rgba(255,255,255,.92)!important;transition:opacity .12s}
.controls.v3 button{font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-width:2px}
button.no{background:#2a1513;border-color:var(--no);color:#f3b3ae}
button.maybe{background:#2a2412;border-color:var(--maybe);color:var(--maybe)}
button.love{background:#2a1219;border-color:var(--love);color:#fff}button.love .h{color:var(--love);font-size:18px}
button.yes{background:var(--yes);border-color:var(--yes);color:#fff}
button.undo{border-color:var(--lagoon);color:#9fd3e6}
.ans{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;margin-right:3px;color:#fff}
.ans.love{background:var(--love)}.ans.yes{background:var(--yes)}.ans.maybe{background:var(--maybe);color:#111}.ans.no{background:var(--no)}
/* responsive: phone-first, centered card, 44px tap targets */
body.single .stage{max-width:520px;max-height:640px}
body.single .controls{max-width:540px}
.opts.single .opt{min-height:100%}
#btnExportTop{min-height:44px;min-width:64px}
footer label,footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 6px}
.end .btnrow button{min-height:44px}
/* v4 pair controls */
.controls.v4{flex-direction:column;gap:6px;max-width:560px}
.controls.v4 .row1,.controls.v4 .row2{display:flex;gap:6px;justify-content:center}
.controls.v4 .row1 button{flex:1;min-height:48px;padding:10px 4px;min-width:0;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-width:2px}
.controls.v4 .row2 button{flex:0 1 auto!important;min-width:130px;min-height:44px;padding:8px 18px!important;font-size:13px}
button.this{background:#0d2a36;border-color:var(--lagoon);color:#bfe6f5}
button.that{background:#33190f;border-color:var(--terracotta);color:#f6c8b6}
button.both{background:#0f2a20;border-color:var(--yes);color:#9fe0c4}
button.neither{background:#2a1513;border-color:var(--no);color:#f3b3ae}
button.love.armed{background:var(--love);color:#fff}button.love.armed .h{color:#fff}
.opt.A .side{color:#7cc6e3}.opt.B .side{color:#ee9a7c}
.opt.hot-a{border-color:var(--lagoon);box-shadow:0 0 0 3px rgba(5,102,141,.35)}
.opt.hot-b{border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(193,80,46,.35)}
.card.love-armed .opt{border-color:var(--love);box-shadow:0 0 0 3px rgba(224,36,94,.25)}
.stamp.l{right:16px;color:var(--lagoon);border-color:var(--lagoon);transform:rotate(12deg)}.stamp.r{left:16px;color:var(--terracotta);border-color:var(--terracotta);transform:rotate(-12deg)}
.stamp.both{left:50%;top:22%;transform:translateX(-50%) rotate(-4deg);color:var(--yes);border-color:var(--yes)}
.stamp.neither{left:50%;top:22%;transform:translateX(-50%) rotate(4deg);color:var(--no);border-color:var(--no)}
.stamp.lovea{left:16px;top:22%;color:var(--love);border-color:var(--love)}.stamp.loveb{right:16px;top:22%;color:var(--love);border-color:var(--love);transform:rotate(8deg)}
body.pairs .stage{max-width:760px;max-height:620px}
@media (max-width:420px){.controls.v4 .row1 button{font-size:12px;letter-spacing:.02em}}
/* end screen */
.end{max-width:760px;width:100%;flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 4px 30px}
.end h2{margin:10px 0 6px}.end h3{margin:16px 0 6px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:11px}
.bars .r{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.bars .t{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.bars .t i{position:absolute;top:0;bottom:0;border-radius:5px}
.catlist{font-size:13px;color:#cfd5de}.catlist div{margin:4px 0}.catlist b{color:var(--text)}
textarea{width:100%;height:220px;background:#0e1013;color:#cde;border:1px solid var(--line);border-radius:10px;font:12px/1.4 'IBM Plex Mono',monospace;padding:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
footer{color:var(--muted);font-size:11px;text-align:center;padding:4px 10px 10px}
footer a{color:var(--muted)}
details{font-size:11px;color:var(--muted)}
@media (max-width:560px){
  .opt{padding:6px}.opt h3{font-size:13px}.opt p{font-size:11px}
  .v-type .h{font-size:19px}.v-logo .wd{font-size:15px}.v-tone{font-size:12px}
  .v-img img{height:130px}.bars .r{grid-template-columns:90px 1fr 30px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .controls button{flex:1;padding:12px 4px;min-width:0;font-size:13px}
}
</style>

<body>
<header>
  <h1>Style Swipe</h1>
  <span class="sub" id="sub">Loading…</span>
  <span style="flex:1"></span>
  <button class="small mw-hover" id="btnExportTop" title="Export what you have so far">Export</button>
  <div class="progress"><div id="prog"></div></div>
</header>
<main id="main">
  <div class="stage" id="stage"></div>
</main>
<div class="controls v3" id="controls3" style="display:none">
  <button class="no mw-hover" id="bNo" title="Left arrow">✕ No</button>
  <button class="maybe mw-hover" id="bMaybe" title="M / Down arrow">Maybe</button>
  <button class="love mw-hover" id="bLove" title="L / Up arrow"><span class="h">❤</span> Love</button>
  <button class="yes mw-hover" id="bYes" title="Right arrow">Yes ✓</button>
  <button class="undo mw-hover" id="bU3" title="Backspace / Z">↶</button>
</div>
<div class="controls v4" id="controls">
  <div class="row1">
  <button class="this mw-hover" id="bA" title="Left arrow">◀ This</button>
  <button class="both mw-hover" id="bBoth" title="B">Both</button>
  <button class="love mw-hover" id="bLoveP" title="L, then tap an option"><span class="h">❤</span> Love</button>
  <button class="that mw-hover" id="bB" title="Right arrow">That ▶</button>
  </div><div class="row2">
  <button class="neither mw-hover" id="bN" title="Down arrow / N">✕ Neither</button>
  <button class="undo mw-hover" id="bU" title="Backspace / Z">↶ Undo</button>
  </div>
</div>
<div class="hint" id="hint"></div>
<footer>
  <label style="cursor:pointer;text-decoration:underline">Load Another Deck (JSON)<input type="file" id="deckFile" accept=".json,application/json" hidden></label>
  · <a href="#" id="creditsLink">Image Credits</a>
</footer>
<div class="toast" id="toast"></div>
<script>
const EMBEDDED_DECK = /*__DECK_JSON__*/null;
const EMBEDDED_IMAGES = /*__IMAGES_JSON__*/{};

const SCORE={love:2,yes:1,maybe:0,no:-1};

const storeKey = () => single?`styleSwipe:v3:${deck.date}`:`styleSwipe:${deck.date}`;

 if(s&&Array.isArray(s.picks)&&s.picks.every(p=>p&&typeof p==='object')&&(!single||s.v===3)){picks=s.picks;idx=Math.min(Number.isFinite(s.idx)?s.idx:picks.length,items.length)}
 $('#sub').textContent=`Deck ${d.date} · ${items.length} ${single?'cards':'pairs'}`;
 $('#hint').textContent=single?'Swipe left = No, right = Yes. Tap Maybe or ❤ Love in the middle. Arrow keys: ← No, → Yes.':'Swipe or tap: left = This, right = That. Both = like both. ❤ Love: tap Love, then tap the option.';
 save();render()}

 const p=items[idx];
 if(single){
  stage.innerHTML=`<div class="card mw-card" id="card"><div class="cat"><span class="pill">${esc(p.category)}</span><span class="pill">${idx+1} / ${items.length}</span></div>
  <h2>Is This You?</h2><div class="opts single">${optHtml(p.option,'S')}</div>
  <div class="stamp no">NO</div><div class="stamp yes">YES</div><div class="stamp maybe">MAYBE</div><div class="stamp love">LOVE ❤</div></div>`;
 }else{
  stage.innerHTML=`<div class="card mw-card" id="card"><div class="cat"><span class="pill">${esc(p.category)}</span><span class="pill">${idx+1} / ${items.length}</span></div>
  <h2>Which Feels More Like You?</h2><div class="opts">${optHtml(p.optionA,'A')}${optHtml(p.optionB,'B')}</div>
  <div class="stamp l">THIS</div><div class="stamp r">THAT</div><div class="stamp both">BOTH</div><div class="stamp neither">NEITHER</div><div class="stamp lovea">LOVE ❤</div><div class="stamp loveb">LOVE ❤</div></div>`;
 }
 shownAt=performance.now();bindDrag($('#card'));
}
function answer(ans){ // v3
 if(!deck||!single||idx>=items.length)return;
 const c=items[idx],o=c.option;
 picks=picks.filter(x=>x.card_id!==c.id);
 picks.push({card_id:c.id,category:c.category,option_id:o.id,label:o.label,answer:ans,score:SCORE[ans],tags:o.tags||[],
  purpose:c.purpose||null,source_pair:c.source_pair||undefined,ms:Math.round(performance.now()-shownAt),at:new Date().toISOString()});
 const card=$('#card');
 if(card){const st=card.querySelector('.stamp.'+ans);if(st)st.style.opacity=1;
  const t={no:'translateX(-120%) rotate(-14deg)',yes:'translateX(120%) rotate(14deg)',love:'translateY(-110%) scale(1.03)',maybe:'translateY(110%)'}[ans];
  setTimeout(()=>{card.style.transform=t;card.style.opacity=0},160)}
 idx++;save();setTimeout(render,400);
}
let loveArmed=false;
function setLove(on){loveArmed=on;const b=document.getElementById('bLoveP');if(b)b.classList.toggle('armed',on);const c=document.getElementById('card');if(c)c.classList.toggle('love-armed',on)}
const PAIR_SCORE={A:'+1 / -1',B:'-1 / +1',both:'+1 / +1',neither:'-1 / -1',loveA:'+2 / -1',loveB:'-1 / +2',skip:'0'};
function choose(choice){ // pairs: A (This), B (That), both, neither, loveA, loveB
 if(!deck||single||idx>=items.length)return;
 if(loveArmed&&(choice==='A'||choice==='B'))choice='love'+choice;
 setLove(false);
 const p=items[idx], A=p.optionA, B=p.optionB;
 const ch=choice.replace('love','');const chosen=ch==='A'?A:ch==='B'?B:null;
 picks=picks.filter(x=>x.pair_id!==p.id);
 picks.push({pair_id:p.id,category:p.category,choice,optionA:A.id,optionB:B.id,labelA:A.label,labelB:B.label,
  chosen_id:chosen?chosen.id:null,chosen_label:chosen?chosen.label:null,tagsA:A.tags,tagsB:B.tags,
  purpose:p.purpose||null,ms:Math.round(performance.now()-shownAt),at:new Date().toISOString()});
 const card=$('#card');
 if(card){const st=card.querySelector({A:'.stamp.l',B:'.stamp.r',both:'.stamp.both',neither:'.stamp.neither',loveA:'.stamp.lovea',loveB:'.stamp.loveb'}[choice]||'.none');if(st)st.style.opacity=1;
  const t={A:'translateX(-120%) rotate(-14deg)',B:'translateX(120%) rotate(14deg)',loveA:'translateX(-120%) rotate(-14deg)',loveB:'translateX(120%) rotate(14deg)',both:'translateY(-110%)',neither:'translateY(110%)'}[choice]||'translateY(-110%)';
  setTimeout(()=>{card.style.transform=t;card.style.opacity=0},160)}
 idx++;save();setTimeout(render,400);
}
function undo(){if(!deck||idx===0)return;idx--;const p=items[idx];picks=picks.filter(x=>single?x.card_id!==p.id:x.pair_id!==p.id);save();render();toast('Undone')}
function bindDrag(card){
 let sx=0,sy=0,dx=0,dragging=false,id=null;
 const hl=(v)=>{if(single){card.querySelector('.stamp.no').style.opacity=Math.min(1,Math.max(0,-v/110));card.querySelector('.stamp.yes').style.opacity=Math.min(1,Math.max(0,v/110));return}
  card.querySelector('.opt.A').classList.toggle('hot-a',v<-30);card.querySelector('.opt.B').classList.toggle('hot-b',v>30);card.querySelector('.stamp.l').style.opacity=Math.min(1,Math.max(0,-v/110));card.querySelector('.stamp.r').style.opacity=Math.min(1,Math.max(0,v/110))};
 card.addEventListener('pointerdown',e=>{if(e.button>0)return;if(e.target.closest&&e.target.closest('.play'))return;sx=e.clientX;sy=e.clientY;dx=0;dragging=true;id=e.pointerId});
 card.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==id)return;dx=e.clientX-sx;const dy=e.clientY-sy;
  if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){card.classList.add('dragging');try{card.setPointerCapture(id)}catch(_){}}
  if(card.classList.contains('dragging')){card.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;hl(dx)}});
 const end=e=>{if(!dragging)return;dragging=false;const wasDrag=card.classList.contains('dragging');card.classList.remove('dragging');
  if(wasDrag){if(single){if(dx<-90)return answer('no');if(dx>90)return answer('yes')}else{if(dx<-90)return choose('A');if(dx>90)return choose('B')}card.style.transform='';hl(0);return}
  if(single)return; // single cards: a tap does nothing (use the buttons)
  const opt=e.target.closest&&e.target.closest('.opt');if(opt&&e.type==='pointerup'){opt.classList.add(opt.dataset.side==='A'?'hot-a':'hot-b');setTimeout(()=>choose(opt.dataset.side),140)}};
 card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
}

/* ---------- results ---------- */
function rank(tags){const ranked=Object.entries(tags).sort((a,b)=>b[1]-a[1]);
 return {top:ranked.filter(x=>x[1]>0).slice(0,12).map(([t,s])=>({tag:t,score:s})),avoid:ranked.filter(x=>x[1]<0).slice(-8).reverse().map(([t,s])=>({tag:t,score:s}))}}
function pairScores(c){return {A:[1,-1],B:[-1,1],both:[1,1],neither:[-1,-1],loveA:[2,-1],loveB:[-1,2]}[c]||[0,0]}
function buildResults(){
 if(!single){
  const totals={A:0,B:0,both:0,loveA:0,loveB:0,neither:0,skip:0},tags={},byCat={},loved=[];
  for(const p of picks){totals[p.choice]=(totals[p.choice]||0)+1;const [sa,sb]=pairScores(p.choice);
   (p.tagsA||[]).forEach(t=>tags[t]=(tags[t]||0)+sa);(p.tagsB||[]).forEach(t=>tags[t]=(tags[t]||0)+sb);
   const lab={A:p.labelA,B:p.labelB,loveA:'❤ '+p.labelA,loveB:'❤ '+p.labelB,both:`both: ${p.labelA} + ${p.labelB}`,neither:`✗ neither (${p.labelA} / ${p.labelB})`}[p.choice];
   if(p.choice==='loveA')loved.push(p.labelA);if(p.choice==='loveB')loved.push(p.labelB);
   if(lab)(byCat[p.category]=byCat[p.category]||[]).push(lab)}
  const r=rank(tags);
  return {app:'style-swipe',version:4,format:'pairs',owner:deck.owner||'Max Weberman',deck:deck.date,
   scoring:{this_or_that:'+1 picked, -1 other',both:'+1 each',love:'+2 loved, -1 other',neither:'-1 each'},
   exported_at:new Date().toISOString(),complete:idx>=items.length,answered:picks.length,total_pairs:items.length,
   totals,top_tags:r.top,avoided_tags:r.avoid,loved,chosen_by_category:byCat,picks}}
 if(single){
  const totals={love:0,yes:0,maybe:0,no:0},tags={},byCat={};
  for(const p of picks){totals[p.answer]=(totals[p.answer]||0)+1;(p.tags||[]).forEach(t=>tags[t]=(tags[t]||0)+(SCORE[p.answer]||0));
   const c=byCat[p.category]=byCat[p.category]||{love:[],yes:[],maybe:[],no:[]};c[p.answer].push(p.label)}
  const r=rank(tags);
  return {app:'style-swipe',version:3,format:'single',owner:deck.owner||'Max Weberman',deck:deck.date,source_deck:deck.source_deck||undefined,
   scoring:SCORE,exported_at:new Date().toISOString(),complete:idx>=items.length,answered:picks.length,total_cards:items.length,
   totals,top_tags:r.top,avoided_tags:r.avoid,loved:picks.filter(p=>p.answer==='love').map(p=>p.label),answers_by_category:byCat,picks}}
 const tally={A:0,B:0,neither:0,skip:0},tags={},byCat={};
 for(const p of picks){tally[p.choice]=(tally[p.choice]||0)+1;
  if(p.choice==='A'||p.choice==='B'){const w=p.choice==='A'?p.tagsA:p.tagsB,l=p.choice==='A'?p.tagsB:p.tagsA;
   w.filter(t=>!l.includes(t)).forEach(t=>tags[t]=(tags[t]||0)+1);l.filter(t=>!w.includes(t)).forEach(t=>tags[t]=(tags[t]||0)-1);
   (byCat[p.category]=byCat[p.category]||[]).push(p.chosen_label)}
  else if(p.choice==='neither'){[...new Set([...p.tagsA,...p.tagsB])].forEach(t=>tags[t]=(tags[t]||0)-.5);(byCat[p.category]=byCat[p.category]||[]).push(`✗ neither (${p.labelA} / ${p.labelB})`)}}
 const r=rank(tags);
 return {app:'style-swipe',version:2,format:'pairs',owner:deck.owner||'Max Weberman',deck:deck.date,
  exported_at:new Date().toISOString(),complete:idx>=items.length,answered:picks.length,total_pairs:items.length,
  totals:tally,top_tags:r.top,avoided_tags:r.avoid,chosen_by_category:byCat,picks}}
function resultsJson(){return JSON.stringify(buildResults(),null,1)}
function download(){const blob=new Blob([resultsJson()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`style-swipe-results-${deck.date}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Downloaded')}
async function copy(){const txt=resultsJson();try{await navigator.clipboard.writeText(txt);toast('Copied JSON')}catch(e){const ta=$('#resText');if(ta){ta.select();document.execCommand('copy');toast('Copied JSON')}else toast('Copy failed: use the text box')}}
async function share(){const txt=resultsJson();const file=new File([txt],`style-swipe-results-${deck.date}.json`,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:`Style Swipe ${deck.date}`});
  else if(navigator.share)await navigator.share({title:`Style Swipe ${deck.date}`,text:txt});else{copy();}}catch(e){}}
function showEnd(){
 showControls(false);
 const r=buildResults(),max=Math.max(1,...r.top_tags.map(x=>x.score),...r.avoided_tags.map(x=>-x.score));
 const bar=(x,col)=>`<div class="r"><span>${esc(x.tag)}</span><div class="t"><i style="left:0;width:${100*Math.abs(x.score)/max}%;background:${col}"></i></div><span>${x.score>0?'+':''}${x.score}</span></div>`;
 let stats,cats;
 if(single){const t=r.totals;
  stats=`<div class="stat"><b style="color:var(--love)">❤ ${t.love}</b><span>Love</span></div><div class="stat"><b style="color:#4fc79a">${t.yes}</b><span>Yes</span></div><div class="stat"><b style="color:var(--maybe)">${t.maybe}</b><span>Maybe</span></div><div class="stat"><b style="color:#e8746f">${t.no}</b><span>No</span></div>`;
  cats=`<h3>Your Answers By Category</h3><div class="catlist">${Object.entries(r.answers_by_category).map(([c,a])=>`<div><b>${esc(c)}:</b> ${['love','yes','maybe','no'].flatMap(k=>a[k].map(l=>`<span class="ans ${k}">${k==='love'?'❤':k.toUpperCase()}</span>${esc(l)}`)).join(' · ')}</div>`).join('')}</div>`;
 }else{
  const t=r.totals;stats=`<div class="stat"><b>${t.A+t.B}</b><span>This / That</span></div><div class="stat"><b style="color:var(--love)">❤ ${t.loveA+t.loveB}</b><span>Loved</span></div><div class="stat"><b style="color:#4fc79a">${t.both}</b><span>Both</span></div><div class="stat"><b style="color:#e8746f">${t.neither}</b><span>Neither</span></div>`;
  cats=`<h3>Your Picks By Category</h3><div class="catlist">${Object.entries(r.chosen_by_category).map(([c,l])=>`<div><b>${esc(c)}:</b> ${l.map(esc).join(' · ')}</div>`).join('')}</div>`;
 }
 $('#main').innerHTML=`<div class="end"><h2>Your Style Summary</h2>
 <div class="stats">${stats}</div>
 ${r.loved&&r.loved.length?`<h3>❤ Loved</h3><div class="catlist">${r.loved.map(esc).join(' · ')}</div>`:''}
 <h3>Tags You Lean Toward</h3><div class="bars">${r.top_tags.map(x=>bar(x,'var(--ok)')).join('')||'<span class="hint">None yet</span>'}</div>
 <h3>Tags You Avoid</h3><div class="bars">${r.avoided_tags.map(x=>bar(x,'var(--no)')).join('')||'<span class="hint">None yet</span>'}</div>
 ${cats}
 <h3>Send Results Back</h3><div class="hint" style="text-align:left;padding:0">Download the JSON file, or copy the text below and paste it into a chat with your agent.</div>
 <div class="btnrow"><button class="primary mw-hover" id="eDl">⬇ Export JSON</button><button class="mw-hover" id="eCp">Copy JSON</button><button class="mw-hover" id="eSh">Share…</button><button class="mw-hover" id="eBack">↶ Back To Last Card</button><button class="mw-hover" id="eReset">Start Over</button></div>
 <textarea id="resText" readonly>${esc(JSON.stringify(r,null,1))}</textarea></div>`;
 $('#eDl').onclick=download;$('#eCp').onclick=copy;$('#eSh').onclick=share;$('#eBack').onclick=undo;
 $('#eReset').onclick=()=>{if(confirm('Clear all answers for this deck?')){picks=[];idx=0;save();render()}};
}

/* ---------- wiring ---------- */
$('#bA').onclick=()=>choose('A');$('#bB').onclick=()=>choose('B');$('#bN').onclick=()=>choose('neither');$('#bBoth').onclick=()=>choose('both');$('#bU').onclick=()=>{setLove(false);undo()};
$('#bLoveP').onclick=()=>{setLove(!loveArmed);if(loveArmed)toast('Now tap the option you love')};
$('#bNo').onclick=()=>answer('no');$('#bMaybe').onclick=()=>answer('maybe');$('#bLove').onclick=()=>answer('love');$('#bYes').onclick=()=>answer('yes');$('#bU3').onclick=undo;
$('#btnExportTop').onclick=()=>{if(deck)download()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||!deck)return;const k=e.key;
 if(k==='Backspace'||k==='z'){e.preventDefault();return undo()}
 if(single){if(k==='ArrowLeft')answer('no');else if(k==='ArrowRight')answer('yes');else if(k==='m'||k==='ArrowDown')answer('maybe');else if(k==='l'||k==='ArrowUp')answer('love');return}
 if(k==='ArrowLeft')choose('A');else if(k==='ArrowRight')choose('B');else if(k==='ArrowDown'||k==='n')choose('neither');else if(k==='b'||k==='ArrowUp')choose('both');else if(k==='l')setLove(!loveArmed);else if(k==='Escape')setLove(false)});
$('#deckFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.pairs&&!d.cards)throw 0;setDeck(d);toast(`Loaded deck ${d.date}`)}catch(_){toast('Not a valid deck file')}};
$('#creditsLink').onclick=e=>{e.preventDefault();const c=(deck&&deck.image_credits)||{};$('#main').innerHTML=`<div class="end"><h2>Image Credits</h2><div class="catlist">${Object.values(c).map(x=>`<div><a style="color:#9cf" href="${esc(x.source)}" target="_blank" rel="noopener">${esc(x.title)}</a> · ${esc(x.artist||'Unknown')} · ${esc(x.license)}</div>`).join('')||'None'}</div><div class="btnrow"><button class="mw-hover" id="cBack">Back</button></div></div>`;showControls(false);$('#cBack').onclick=()=>render()};
(async()=>{
 const want=new URLSearchParams(location.search).get('date');
 if(want&&(!EMBEDDED_DECK||EMBEDDED_DECK.date!==want)){try{const r=await fetch(`decks/${want}.json`,{cache:'no-cache'});if(r.ok)return setDeck(await r.json())}catch(_){}toast(`Deck ${want} not found; showing embedded deck`)}
 if(EMBEDDED_DECK)return setDeck(EMBEDDED_DECK);
 try{const r=await fetch(`decks/${new Date().toISOString().slice(0,10)}.json`);if(r.ok)return setDeck(await r.json())}catch(_){}
 $('#sub').textContent='No deck found. Use "Load Another Deck" below.';
})();
</script>
</body>
